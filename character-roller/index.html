<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Character Roller: листок персонажа D&amp;D 5e</title>
<meta name="description" content="Генератор випадкового листка персонажа D&D 5e за правилами SRD 5.1: раса, клас, підклас, рівень 1-20, характеристики, навички, HP, КБ, закляття, риси класу, спорядження та особистість. Фіксація полів, експорт у JSON, друк. Безкоштовно, працює офлайн.">
<link rel="canonical" href="https://zbyrai.pages.dev/character-roller/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Zbyrai">
<meta property="og:title" content="Character Roller: листок персонажа D&amp;D 5e">
<meta property="og:description" content="Випадковий персонаж за SRD 5.1: від 1 до 20 рівня, із закляттями, рисами й спорядженням. Експорт у JSON і друк.">
<meta property="og:url" content="https://zbyrai.pages.dev/character-roller/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%2309090c%27/%3E%3Cpath d=%27M16 4 26 10v12L16 28 6 22V10z%27 fill=%27none%27 stroke=%27%23e5675f%27 stroke-width=%272%27 stroke-linejoin=%27round%27/%3E%3Cpath d=%27M16 4v24M6 10l20 12M26 10 6 22%27 fill=%27none%27 stroke=%27%23e5675f%27 stroke-width=%271.2%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="./theme.css">
<link rel="stylesheet" href="./style.css">
</head>
<body class="has-grain">

<header class="top">
  <a class="hub-back" id="hubBack" href="../index.html" hidden><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg><span>Zbyr<b>AI</b></span></a>
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.5 20.5 7.5v9L12 21.5 3.5 16.5v-9z"/><path d="M12 2.5v19M3.5 7.5l17 9M20.5 7.5l-17 9"/></svg>
    <div>Character <span>Roller</span></div>
  </div>
  <div class="spacer"></div>
  <button id="btnPrint" title="Надрукувати листок (Ctrl+P)">Друк</button>
  <button id="btnCopy" title="Скопіювати персонажа як JSON">Копіювати JSON</button>
  <button class="btn-primary" id="btnSave" title="Завантажити character.json">Зберегти .json</button>
</header>

<main class="panes">
  <section class="pane" id="paneParams">
    <div class="pane-h"><h2>Параметри</h2><span class="spacer"></span><button id="btnClear" title="Усе знову випадкове">Скинути</button></div>
    <div class="pane-b" id="params"></div>
    <div class="pane-f">
      <button class="btn-forge" id="btnRoll">Зарандомити</button>
      <button id="btnChaos" title="Скинути всі фіксації й випадково обрати навіть метод характеристик">Все випадково</button>
      <button id="btnPin" title="Зафіксувати расу, клас, рівень і передісторію поточного персонажа">Закріпити поточне</button>
      <kbd>Пробіл</kbd>
    </div>
  </section>

  <section class="pane" id="paneSheet">
    <div class="pane-b" id="sheetWrap"><div id="sheet"></div></div>
  </section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){var a=document.getElementById('hubBack');if(!a)return;var s=false;try{s=!!sessionStorage.getItem('hub')}catch(e){}
if(/^https?:$/.test(location.protocol)||s)a.hidden=false})();
</script>
<script src="./srd-spells.js"></script>
<script src="./srd-data.js"></script>
<script src="./srd-classes.js"></script>
<script src="./srd-names.js"></script>
<script src="./char-core.js"></script>
<script src="./app.js"></script>
</body>
</html>
