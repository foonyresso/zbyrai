<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Адмінка SD</title>
<link rel="stylesheet" href="./theme.css">
<style>
  body { margin: 0; padding: 20px 16px; max-width: 560px; margin-inline: auto; font: 15px/1.4 system-ui, sans-serif; }
  h1 { font-size: 20px; } .row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .row b { flex: 1; } .st { font-size: 12px; color: var(--muted); } .st.pending { color: #e8c85a; } .st.active { color: #7fd69a; } .st.blocked { color: #e8924a; }
  input { box-sizing: border-box; width: 100%; margin: 8px 0; } .err { color: #e8924a; min-height: 1.2em; }
</style>
</head>
<body>
<h1>Адмінка «Віддаленого SD»</h1>
<form id="f"><input type="password" id="pw" placeholder="Пароль адміна" title="Пароль адміна (секрет ADMIN_PASSWORD у Cloudflare)" autocomplete="current-password"><button type="submit" title="Показати список акаунтів">Показати акаунти</button></form>
<p class="err" id="err"></p>
<div id="list"></div>
<script>
(function () {
  var pw = '', list = document.getElementById('list'), err = document.getElementById('err');
  function api(path, body) {
    return fetch('/api/sd/' + path, { method: body ? 'POST' : 'GET', headers: { 'x-admin': pw, 'content-type': 'application/json' }, body: body ? JSON.stringify(body) : undefined })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || r.status); return j; }); });
  }
  function load() {
    api('admin-list').then(function (r) {
      err.textContent = ''; list.textContent = '';
      if (!r.users.length) list.textContent = 'Акаунтів ще немає.';
      r.users.forEach(function (u) {
        var row = document.createElement('div'); row.className = 'row';
        var n = document.createElement('b'); n.textContent = u.login;
        var st = document.createElement('span'); st.className = 'st ' + u.status; st.textContent = { pending: 'чекає', active: 'активний', blocked: 'заблокований' }[u.status] || u.status;
        row.appendChild(n); row.appendChild(st);
        [['approve', 'Відкрити доступ', 'Підтвердити акаунт'], ['block', 'Закрити', 'Заблокувати акаунт'], ['delete', 'Видалити', 'Видалити акаунт']].forEach(function (a) {
          var b = document.createElement('button'); b.textContent = a[1]; b.title = a[2];
          b.addEventListener('click', function () { if (a[0] === 'delete' && !confirm('Видалити ' + u.login + '?')) return; api('admin-set', { login: u.login, action: a[0] }).then(load, function (e) { err.textContent = e.message; }); });
          row.appendChild(b);
        });
        list.appendChild(row);
      });
    }, function (e) { err.textContent = e.message; });
  }
  document.getElementById('f').addEventListener('submit', function (e) { e.preventDefault(); pw = document.getElementById('pw').value; load(); });
})();
</script>
</body>
</html>
