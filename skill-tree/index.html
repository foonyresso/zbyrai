<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skill Tree Lab: редактор дерев скілів</title>
<meta name="description" content="Редактор дерев скілів і талантів для ігор: вузли, зв’язки, вимоги, ціна, режим «пограти», генератор дерев на сотні вузлів і експорт у JSON. Безкоштовно, працює офлайн.">
<link rel="canonical" href="https://zbyrai.pages.dev/skill-tree/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Zbyrai">
<meta property="og:title" content="Skill Tree Lab: редактор дерев скілів">
<meta property="og:description" content="Малюй дерева скілів, перевіряй їх у режимі гри й генеруй великі дерева. Експорт у JSON.">
<meta property="og:url" content="https://zbyrai.pages.dev/skill-tree/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%2309090c%27/%3E%3Cpath d=%27M16 5 26 11v10L16 27 6 21V11z%27 fill=%27none%27 stroke=%27%237aa7e6%27 stroke-width=%272%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="./theme.css">
<link rel="stylesheet" href="./style.css">
</head>
<body class="has-grain">

<header class="top">
  <a class="hub-back" id="hubBack" href="../index.html" hidden><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg><span>Zbyr<b>AI</b></span></a>
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="5" r="2.2"/><circle cx="5" cy="19" r="2.2"/><circle cx="12" cy="19" r="2.2"/><circle cx="19" cy="19" r="2.2"/><path d="M12 7.2V12M12 12 5 16.8M12 12v4.8M12 12l7 4.8"/></svg>
    <div>Skill Tree <span>Lab</span></div>
  </div>
  <div class="seg" id="modeSeg" role="group" aria-label="Режим">
    <button data-mode="play">Грати</button>
    <button data-mode="edit">Редагувати</button>
  </div>
  <div class="spacer"></div>
  <button id="btnImport">Імпорт</button>
  <button id="btnCopy" title="Скопіювати дерево й поточний розподіл як JSON">Копіювати JSON</button>
  <button class="btn-primary" id="btnSave" title="Завантажити skill-tree.json">Зберегти .json</button>
</header>

<main class="lab">
  <section class="stage" id="stage" aria-label="Дерево скілів">
    <canvas id="cv" tabindex="0" aria-label="Полотно дерева. Клік вкладає очко, правий клік або Shift+клік повертає."></canvas>
    <div class="hud tl">
      <span class="pts" id="pts"></span>
      <button id="btnResetBuild" title="Забрати всі вкладені очки">Скинути</button>
    </div>
    <div class="hud br">
      <button id="btnLayout" title="Розкласти вузли автоматично" class="edit-only">Розкласти</button>
      <button id="zoomOut" aria-label="Зменшити">−</button>
      <button id="zoomIn" aria-label="Збільшити">+</button>
      <button id="zoomFit" title="Вмістити все дерево">Вмістити</button>
    </div>
    <div class="tip" id="tip" role="tooltip" hidden></div>
    <p class="help" id="help"></p>
  </section>

  <aside class="side">
    <section class="card">
      <h2>Підсумок</h2>
      <div id="sum"></div>
    </section>
    <section class="card">
      <h2>Вузол</h2>
      <div id="inspector"></div>
    </section>
    <section class="card">
      <h2>Дерево</h2>
      <div id="treeset"></div>
    </section>
  </aside>
</main>

<dialog id="dlgImport" class="modal">
  <form method="dialog">
    <h3>Імпорт дерева</h3>
    <p class="hint">Встав JSON, який дав «Копіювати JSON» або «Зберегти .json», або обери файл. Поточне дерево буде замінено.</p>
    <textarea id="importText" rows="10" spellcheck="false" placeholder='{ "format": "zbyrai.skill-tree", … }'></textarea>
    <p class="err" id="importErr" role="alert"></p>
    <div class="dlg-foot">
      <button type="button" id="importFile">Обрати файл…</button>
      <span class="spacer"></span>
      <button value="cancel">Скасувати</button>
      <button type="button" class="btn-primary" id="importGo">Імпортувати</button>
    </div>
    <input type="file" id="importFileInput" accept=".json,application/json" hidden>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){var a=document.getElementById('hubBack');if(!a)return;var s=false;try{s=!!sessionStorage.getItem('hub')}catch(e){}
if(/^https?:$/.test(location.protocol)||s)a.hidden=false})();
</script>
<script src="./tree-core.js"></script>
<script src="./app.js"></script>
</body>
</html>
