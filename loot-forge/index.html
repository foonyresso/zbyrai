<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loot Forge: кузня предметів</title>
<meta name="description" content="Кузня предметів для ігор: рідкості, афікси, випадкові стати, назви з чорним гумором. Симуляція тисяч дропів і калькулятор шансу легендарки. Експорт у JSON. Безкоштовно, працює офлайн.">
<link rel="canonical" href="https://zbyrai.pages.dev/loot-forge/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Zbyrai">
<meta property="og:title" content="Loot Forge: кузня предметів">
<meta property="og:description" content="Рідкості, афікси, симуляція дропу й калькулятор шансів. Експорт предметів у JSON для вашої гри.">
<meta property="og:url" content="https://zbyrai.pages.dev/loot-forge/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%2309090c%27/%3E%3Cpath d=%27M16 5 26 11v10L16 27 6 21V11z%27 fill=%27none%27 stroke=%27%23e8924a%27 stroke-width=%272%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="./theme.css">
<link rel="stylesheet" href="./style.css">
</head>
<body class="has-grain">

<header class="top">
  <a class="hub-back" id="hubBack" href="../index.html" hidden><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg><span>Zbyr<b>AI</b></span></a>
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.5 20 9l-8 12.5L4 9z"/><path d="M4 9h16M9 9l3 12.5L15 9M9 9l3-6.5L15 9"/></svg>
    <div>Loot <span>Forge</span></div>
  </div>
  <div class="spacer"></div>
  <label class="hdr-field"><span>Набір</span><select id="selPreset" aria-label="Готовий набір правил"></select></label>
  <button id="btnImport">Імпорт</button>
  <button id="btnCopy" title="Скопіювати конфіг і поточні предмети як JSON">Копіювати JSON</button>
  <button class="btn-primary" id="btnSave" title="Завантажити items.json">Зберегти .json</button>
</header>

<main class="panes">
  <!-- ЛІВА ПАНЕЛЬ: правила -->
  <section class="pane" id="paneRules">
    <div class="pane-h"><h2>Правила</h2><span class="spacer"></span><button id="btnReset" title="Повернути вибраний набір до початкових значень">Скинути набір</button></div>
    <div class="pane-b" id="rules"></div>
  </section>

  <!-- ПРАВА ПАНЕЛЬ: результати -->
  <section class="pane" id="paneOut">
    <div class="pane-h">
      <div class="seg" id="tabs" role="tablist" aria-label="Режим результатів">
        <button role="tab" data-tab="items">Предмети</button>
        <button role="tab" data-tab="sim">Симуляція</button>
        <button role="tab" data-tab="calc">Шанси</button>
      </div>
    </div>
    <div class="pane-b" id="out"></div>
  </section>
</main>

<dialog id="dlgImport" class="modal">
  <form method="dialog">
    <h3>Імпорт конфігу</h3>
    <p class="hint">Встав JSON, який дав «Копіювати JSON» або «Зберегти .json», або обери файл. Поточні правила буде замінено.</p>
    <textarea id="importText" rows="10" spellcheck="false" placeholder='{ "format": "zbyrai.loot-forge", … }'></textarea>
    <p class="err" id="importErr" role="alert"></p>
    <div class="dlg-foot">
      <button type="button" id="importFile">Обрати файл…</button>
      <span class="spacer"></span>
      <button value="cancel">Скасувати</button>
      <button type="button" class="btn-primary" id="importGo">Імпортувати</button>
    </div>
    <input type="file" id="importFileInput" accept=".json,application/json" hidden>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){var a=document.getElementById('hubBack');if(!a)return;var s=false;try{s=!!sessionStorage.getItem('hub')}catch(e){}
if(/^https?:$/.test(location.protocol)||s)a.hidden=false})();
</script>
<script src="./loot-core.js"></script>
<script src="./app.js"></script>
</body>
</html>
